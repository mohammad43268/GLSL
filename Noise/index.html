<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLSL Noise & GSAP Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="overlay">
      <nav class="nav">
        <div class="logo">NOISE.</div>
        <div class="nav-links">
          <a href="#">About</a>
          <a href="#">Work</a>
          <a href="#">Contact</a>
        </div>
      </nav>
      <main class="hero">
        <h1 class="hero-title">Fluid<br/>Dynamics</h1>
        <p class="hero-subtitle">Exploring the intersection of Three.js, GLSL shaders, and GSAP animations to create premium web experiences.</p>
        <button class="hero-cta" id="explore-btn">Explore</button>
      </main>
      <div class="controls">
        <div class="control-group">
          <label for="speed-slider">Speed</label>
          <input type="range" id="speed-slider" min="0" max="1" step="0.01" value="0.2">
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
